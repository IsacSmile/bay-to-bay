<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#0066EE" />
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Clean Rounded Square Container Background -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#E2E8F0" stroke-width="12" />

  <!-- Evergreen Pine Trees Cluster -->
  <!-- Left Small Pine Tree -->
  <path d="M155 270 L195 270 L180 235 L190 235 L175 200 L183 200 L170 170 L157 200 L165 200 L150 235 L160 235 Z" fill="#10B981" />
  
  <!-- Center Main Large Pine Tree -->
  <path d="M210 270 L280 270 L260 220 L272 220 L252 170 L262 170 L245 125 L228 170 L238 170 L218 220 L230 220 Z" fill="url(#treeGrad)" />
  
  <!-- Right Medium Pine Tree -->
  <path d="M295 270 L345 270 L330 228 L340 228 L322 188 L330 188 L318 155 L306 188 L314 188 L296 228 L306 228 Z" fill="#059669" />

  <!-- Tree Trunks -->
  <rect x="168" y="270" width="8" height="15" fill="#064E3B" rx="2" />
  <rect x="241" y="270" width="12" height="18" fill="#064E3B" rx="2" />
  <rect x="314" y="270" width="10" height="16" fill="#064E3B" rx="2" />

  <!-- Signature Dynamic Flowing Waves (Bay to Bay) -->
  <!-- Top Dark Blue Wave -->
  <path d="M80 305 C140 280, 200 325, 270 300 C340 275, 400 315, 440 295 C410 325, 340 335, 270 320 C200 305, 140 330, 80 305 Z" fill="url(#wave1)" />

  <!-- Bottom Teal/Cyan Wave -->
  <path d="M72 340 C135 315, 195 360, 268 335 C338 310, 405 350, 440 332 C415 365, 345 370, 268 355 C195 340, 135 368, 72 340 Z" fill="url(#wave2)" />
  
  <!-- Lower Solid Base Accent Bar -->
  <path d="M64 380 C150 380, 362 380, 448 380" stroke="#0088FF" stroke-width="14" stroke-linecap="round" />
</svg>
